name: Compilar ejecutables multiplataforma

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "build.py"

permissions:
  contents: read

jobs:
  package:
    name: Paquete ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Wardrive-Track-Linux
            exe: Wardrive-Track
          - os: macos-latest
            artifact: Wardrive-Track-macOS
            exe: Wardrive-Track
          - os: windows-latest
            artifact: Wardrive-Track-Windows
            exe: Wardrive-Track.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Verificar sintaxis JavaScript
        run: node --check web/app.js
      - name: Pruebas previas
        run: python -m unittest discover -s tests -v
      - name: Compilar
        run: python build.py
      - name: Verificar ejecutable
        run: ./dist/${{ matrix.exe }} --help
      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 30
