name: Compilar última versión de Wardrive Track

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "wardrive_track/**"
      - "web/**"
      - "examples/**"
      - "scripts/verify_build.py"
      - "run.py"
      - "build.py"
      - "tests/**"

permissions:
  contents: read

jobs:
  package:
    name: Compilar ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar compilador
        run: python -m pip install --upgrade pyinstaller
      - name: Comprobar Python
        run: python -m compileall -q run.py wardrive_track tests scripts
      - name: Comprobar JavaScript
        run: node --check web/app.js
      - name: Pruebas automatizadas
        run: python -m unittest discover -s tests -v
      - name: Compilar con nombre de versión
        id: build
        run: python build.py
      - name: Verificar ejecutable REAL, versión, autor, interfaz y API
        run: python scripts/verify_build.py "${{ steps.build.outputs.binary_path }}"
      - name: Publicar paquete inequívoco
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.binary_path }}
          if-no-files-found: error
          retention-days: 30
